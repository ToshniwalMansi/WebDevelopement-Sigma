<!-- You are given 12 files . 6 audio and 6 video
Design a website with html only which shows these 12 files
1.mp3 , 2.mp3 ........6.mp3
1.mp4 , 2.mp4.........6.mp4 -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MX player</title>
</head>

<body>
  <header>
    <h1 style="text-align: center;">
      MX Player
    </h1>
    <hr>
    This allows you to play a lot of natures video and sounds that can you use for your editing <br>
    <hr>
    </p>
  </header>

  <main>
    <h2>
      Video Player
    </h2>

    <figure>
      <video src="1.mp4" width="400" controls></video>
      <figcaption>Video 1</figcaption>
    </figure>

    <figure>
      <video src="2.mp4" width="400" controls></video>
      <figcaption>2nd video</figcaption>
    </figure>

    <figure>
      <video src="3.mp4" width="400" controls></video>
      <figcaption>This is next</figcaption>
    </figure>
    <figure>
      <video src="4.mp4" width="400" controls></video>
      <figcaption>Ummmm</figcaption>
    </figure>
    <figure>
      <video src="5.mp4" width="400" controls></video>
      <figcaption>Maybe its gonna end soon ??</figcaption>
    </figure>

    <figure>
      <video src="6.mp4" width="400" controls></video>
      <figcaption>Here it ends</figcaption>
    </figure>


    <h2>
      Audio Player
    </h2>
    <audio src="1.mp3" controls>We need description for this</audio><br>
    <audio src="2.mp3" controls>We need description for this as well</audio><br>
    <audio src="3.mp3" controls>description for this</audio> <br>
    <audio src="4.mp3" controls>We need</audio> <br>
    <audio src="5.mp3" controls>I am writing whatever comes to my mind</audio> <br>
    <audio src="6.mp3" controls>Ok this is last</audio> <br>
  </main>
</body>

</html>
