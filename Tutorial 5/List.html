<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table</title>
</head>
<body>
  
  <h1>Unordered Lists</h1>
  <ul>
    <li>Mansi</li>
    <li>Rahshi</li>
    <li>Harshita</li>
  </ul>

  <h1>Unordered Lists</h1>
  <ul type="Square">
    <li>Mansi</li>
    <li>Rahshi</li>
    <li>Harshita</li>
  </ul>

  <h1>Ordered List </h1>
    <ol>
      <li>Mansi</li>
      <li>Rashi</li>
      <li>Harshita</li>
    </ol>

    <h1>Ordered List </h1>
    <ol type="A">
      <li>Mansi</li>
      <li>Rashi</li>
      <li>Harshita</li>
    </ol>
</body>
</html>
