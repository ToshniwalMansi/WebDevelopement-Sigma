<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations</title>
  <style>
    .container {
      background-color: rgb(51, 148, 148);
      height: 80vh;
      width: 30vw;
    }

    .box {
      width: 34px;
      height: 45px;
      
      /* animation: MansiKaAnimation ;
      animation-duration: 1s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.03, 1.59, 0.98, 1.01);
      animation-delay: 3s;
       animation-direction: alternate-reverse; 
      animation-play-state: paused; 
      animation: name duration timing-function delay iteration-count direction fill-mode;
*/

      animation: MansiKaAnimation 1s ease-in-out 2s 1  ,
                 mansi2 3s ease-in-out 3s 1 ;


    }

    @keyframes MansiKaAnimation {
      from {
        background-color: red;
      }

      to {
        background-color: yellow;
        /* transform: translateX(1000px); */
      }

    }


    @keyframes mansi2 {
      0%{
        transform: rotate(100deg);
      }
      20%{
        transform: rotate(200deg);
      }
      50%{
        transform: rotate(220deg);
      }
      80%{
        transform: rotate(300deg);
      }
      100%{
        transform: rotate(310deg);
      }
      
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box">
      Box
    </div>
  </div>
</body>

</html>
