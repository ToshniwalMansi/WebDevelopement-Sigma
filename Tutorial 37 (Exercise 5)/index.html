<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5</title>
  <style>
    *{
      margin: 0;
      padding: 0;
    }
    .navbar{
      display: flex;
      align-items: center;
      justify-content: center;
      height: 85px;
      width: 100vw ;
      background-color: pink;
      /* border: 1px solid black; */
    } 
    
    ul{
      display: flex;
      align-self: center;
      
    }

    ul li{
      list-style: none;
      border: 1px solid black;
      padding: 20px;
      margin: 10px;
      align-content: center;
      font-size: 20px;
      border-radius: 10px;

      
    }

    .mainBox{
      background-color: greenyellow;
      height: 90vh;
      width: 100vw;
      display: flex;
      align-items: center;
    
      gap: 25px;
      justify-content: center;
    }

    .pink{
      background-color: pink;
      width: 45vw;
      height: 70vh;
      /* margin-top: 25px;
      margin-left: 25px; */
    }

    .blue{
      background-color: rgb(105, 105, 215);
      width: 45vw;
      height: 70vh;
      /* padding-top: 25px;
      margin-left: 25px; */
    }

    .end{
      background-color: black;
      width: 100vw;
      height: 60vh;
      align-content: center;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    p{

      width: 85vw;
      height: 40vh;
      text-align: center;

      display: flex;
      justify-content: center;
      align-items: center;

      
      border: 1px solid white;
      font-size: 80px;
      word-wrap: break-word;
      color: aliceblue;
      margin: 100px;
      
      border-radius: 100px;
      padding: 20px;
    }

    .finalend{
      background-color: antiquewhite;
      height: 20vh;
      width: 100vw;
    }


    img{
      
      border-radius: 100px;
      position: fixed;
      right: 20px;
      bottom: 20px;

    }

  </style>
</head>
<body>
    <div class="navbar">
      <ul>
        <li>Home</li>
        <li>About us</li>
        <li>Contact </li>
        <li>More info </li>
      </ul>
    </div>

    <div class="mainBox">
      <div class="pink"></div>
      <div class="blue"></div>
    </div>

    <div class="end">
      <p>Welcome to this Sigma Web Development Course</p>
    </div>

    <div class="finalend">
      
    </div>

    <div class="image">
      <img height="100px" width="100px" src="https://png.pngtree.com/recommend-works/png-clipart/20241009/ourmid/pngtree-cool-blue-dragon-logo-png-image_14012110.png" alt="logo">
    </div>
</body>
</html>
