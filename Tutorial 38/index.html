<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Flexbox</title>
  <style>
    .container {
      border: 2px solid red;
      display: flex;
      height: 80vh;
      /* justify-content: center; */
      align-items: center;
      /* flex-direction: row; */
      flex-wrap: wrap;
      /* align-content: flex-start; */
      flex-flow: row wrap;
      /* flex-direction: row row-reverse; */
      gap: 15px;
    }

    .items {
      /* flex-grow: 1; */
      height: 92px;
      width: 92px;
      border: 2px solid black;
      /* margin: 4px; */
      background-color: violet;
    }

    .order-1 {
      order: 1;
      /* flex-grow: 2; */
      flex-shrink: 2;
    }

    .order-2 {
      order: 2;
      
    }


    .order-3 {
      order: 3;
    }

    .order-4 {
      order: 4;
    }

    .items1{
      align-self: flex-end;
    }
  </style>
</head>

<body>
  <main>
    <div class="container">
      <div class="items items1">1</div>
      <div class="items">2</div>
      <div class="items">3</div>
      <div class="items order-1">4</div>
    

      <div class="items"></div>
      <div class="items"></div>
      <div class="items order-1">502</div>
      <div class="items"></div>
      <div class="items"></div>


      <div class="items"></div>
      <div class="items"></div>
      <div class="items"></div>
      <div class="items"></div>

    </div>
  </main>
</body>

</html>
