<!--Without using a br tag , write a vertically aligned form asking for name , city , pincode of a user -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form </title>
</head>
<body>
  
  <div>
    <label for="name">Enter your name</label>
  <input type="text" name="name" id="name">
    </div>

    <div>
      <label for="city" >Select your city</label>
      <select name="city" id="city">
        <option value="nagpur">Nagpur</option>
        <option value="Akola">Akola</option>
        <option value="Yavatmal">yavatmal</option>
        <option value="Amravati">Amravati</option>
      </select>
    </div>

    <div>
      <label for="pincode">Enter your pincode</label>
      <input type="number" name="pincode" id="pincode" placeholder="eg. 444001" required>
    </div>

</body>
</html>
